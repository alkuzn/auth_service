services:
  db_postgres:
    container_name: test_db_postgres
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:18.3-alpine3.23
        COPY ./init.sql /docker-entrypoint-initdb.d/init.sql
        RUN chown postgres /docker-entrypoint-initdb.d/init.sql
        #COPY ./init-db.sh /docker-entrypoint-initdb.d/init-db.sh
        #RUN <<"EOF"
        #echo "CREATE ROLE ${DB_USER} WITH LOGIN PASSWORD '${DB_PASSWORD}';" >> /docker-entrypoint-initdb.d/1.sql
        #echo "CREATE DATABASE ${DB_NAME};" >> /docker-entrypoint-initdb.d/1.sql
        #echo "GRANT CONNECT, CREATE ON DATABASE ${DB_NAME} TO ${DB_USER};" >> /docker-entrypoint-initdb.d/1.sql
        #echo "\с ${DB_NAME}" >> /docker-entrypoint-initdb.d/1.sql
        #echo "GRANT USAGE, CREATE ON SCHEMA PUBLIC TO ${DB_USER};" >> /docker-entrypoint-initdb.d/1.sql
        #EOF
    ports:
      - "${DB_PORT}:${DB_PORT}"
    healthcheck:
      test: "pg_isready -U postgres"
      start_period: 1m
      interval: 10s
      retries: 5
    environment:
      POSTGRES_PASSWORD: 9999
    networks:
      common:
