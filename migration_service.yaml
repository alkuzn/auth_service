services:
  migrate_db:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY ./ /app
        RUN \
        --mount=type=cache,target=/root/.cache/uv \
        --mount=type=cache,target=/root/.cache/pip \
        pip install uv && python -m uv sync --frozen
        CMD . ./migrate.sh
    depends_on:
      db_postgres:
        condition: service_healthy
    environment:
      DB_HOST: db_postgres
    develop:
      watch:
        - path: .
          target: /app
          action: sync
          initial_sync: true

    networks:
      common: